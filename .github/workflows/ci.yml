name: CI

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            exe: idrac6
          - os: windows-latest
            name: windows-x86_64
            exe: idrac6.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (OpenSSL build)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Test
        run: cargo test --features vendored-openssl
      - name: Build
        run: cargo build --release --features vendored-openssl
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/${{ matrix.exe }} README.md LICENSE dist/
          tar -C dist -czf idrac6-${{ matrix.name }}.tar.gz .
          cargo install cargo-deb --locked
          cargo deb --no-build --output idrac6-amd64.deb
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/${{ matrix.exe }}, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath idrac6-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: idrac6-${{ matrix.name }}
          path: |
            idrac6-${{ matrix.name }}.*
            idrac6-amd64.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: idrac6-*
          generate_release_notes: true
